<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FLHS Flying L coupon quick print — pick a teacher or Select All and print double-sided sheets." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Quick Print Coupons | FLHS Help Hub</title>
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/coupons.css" />
</head>
<body>
  <div class="page">
    <div class="wrap narrow">
      <section class="board no-print" id="lock-gate" aria-labelledby="gate-title">
        <div class="top">
          <div class="brand">
            <img src="../../assets/brand/logo.png" width="88" height="88" alt="" />
            <div>
              <p class="kicker">IT only · FLHSHelp</p>
              <h1 id="gate-title">Quick print</h1>
            </div>
          </div>
          <a class="home" href="../">Coupons</a>
        </div>
        <p class="lead">Unlock with the staff upload key, then print.</p>
        <form id="unlock-form">
          <label class="field">
            <span>Staff upload key</span>
            <input id="upload-key" type="password" autocomplete="current-password" required placeholder="Paste staff upload key" />
          </label>
          <button class="btn btn-primary" type="submit">Unlock</button>
          <p class="status" id="gate-status" role="status"></p>
        </form>
      </section>

      <div id="app" hidden>
        <section class="board no-print" aria-labelledby="qp-title">
          <div class="top">
            <div class="brand">
              <img src="../../assets/brand/logo.png" width="88" height="88" alt="" />
              <div>
                <p class="kicker">IT only · Flying L PBIS</p>
                <h1 id="qp-title">Quick print</h1>
              </div>
            </div>
            <a class="home" href="../">Coupons</a>
          </div>
          <p class="lead">Pick a teacher or Select All, then print from the staff directory already in the database.</p>

          <label class="field">
            <span>Find a teacher</span>
            <input id="teacher-search" type="search" placeholder="Search name or room" />
          </label>
          <div class="list-tools">
            <label class="toggle"><input id="select-all" type="checkbox" /> Select All</label>
            <span class="status" id="count-line" style="margin:0"></span>
          </div>
          <div class="teacher-list" id="teacher-list"></div>

          <label class="field">
            <span>Pages this run (blank = each teacher’s saved pages)</span>
            <input id="qty-override" type="number" min="1" placeholder="1 page = 10 identical coupons" />
          </label>

          <p class="section-label">Printer</p>
          <div class="controls">
            <div class="choice-row">
              <label class="choice"><input type="radio" name="flip" value="long" checked /> Long-edge flip</label>
              <label class="choice"><input type="radio" name="flip" value="short" /> Short-edge flip</label>
            </div>
            <div class="choice-row">
              <label class="choice"><input type="radio" name="order" value="alternating" checked /> Alternating</label>
              <label class="choice"><input type="radio" name="order" value="grouped" /> Fronts, then backs</label>
            </div>
          </div>
          <button class="btn btn-gold" type="button" id="print-btn" style="width:100%">Print</button>
          <p class="status" id="status" role="status"></p>
        </section>
      </div>
    </div>
    <footer class="site no-print">Fort Lauderdale High School</footer>
  </div>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/coupons-api.js"></script>
  <script src="../../js/coupons-print.js"></script>
  <script src="../../js/coupons-quick-print.js"></script>
</body>
</html>
