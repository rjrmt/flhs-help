<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FLHS 2026–2027 school calendar and academic testing calendar — white/blue days, PM/FAST, CTACE, ACT, SAT, AP, and more." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FLHS Help" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Calendar | FLHSHelp</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-200: #9eb8dc;
      --navy: #002366;
      --royal: #0056b3;
      --ink-900: #002366;
      --ink-700: #1a3a6e;
      --ink-500: #3d5680;
      --ink-400: #5a7194;
      --glass: rgba(255, 255, 255, 0.72);
      --border: rgba(197, 204, 216, 0.65);
      --border-soft: rgba(0, 35, 102, 0.16);
      --shadow: 0 28px 64px rgba(0, 35, 102, 0.22), 0 10px 24px rgba(0, 35, 102, 0.12);
      --shadow-soft: 0 12px 30px rgba(0, 35, 102, 0.14);
      --cal-white-bg: #ffffff;
      --cal-white-border: rgba(0, 0, 0, 0.14);
      --cal-white-ink: #0a0a0a;
      --cal-blue-bg: #003399;
      --cal-blue-ink: #ffffff;
      --cal-planning-bg: #c45a18;
      --cal-planning-ink: #ffffff;
      --cal-closed-bg: #4f7a36;
      --cal-closed-ink: #ffffff;
      --cal-erd-bg: #fff7ed;
      --cal-erd-border: #c2410c;
      --cal-erd-ink: #9a3412;
      --cal-exam-gold: #e6b000;
      --cal-exam-gold-deep: #c99200;
      --cal-testing: #0e7490;
      --cal-testing-soft: #ecfeff;
      --acat-pm-fast: #0e7490;
      --acat-ctace: #155e75;
      --acat-ap: #002366;
      --acat-retakes: #b45309;
      --acat-wida: #3f6212;
      --acat-psat: #0056b3;
      --acat-act: #9f1239;
      --acat-sat: #1e3a8a;
      --acat-map: #4d7c0f;
      --acat-government: #92400e;
      --acat-training: #64748b;
      --acat-infrastructure: #475569;
      --acat-multi-a: #0e7490;
      --acat-multi-b: #9f1239;
      --radius-xl: 1.75rem;
      --radius-lg: 1.25rem;
      --radius-md: 1rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink-900);
      background: var(--sky-200);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      /* clip avoids the sticky-breaking behavior of overflow-x: hidden */
      overflow-x: clip;
      background:
        radial-gradient(ellipse 95% 70% at 6% -12%, rgba(0, 86, 179, 0.38), transparent 58%),
        radial-gradient(ellipse 80% 60% at 98% 0%, rgba(0, 35, 102, 0.32), transparent 55%),
        radial-gradient(ellipse 70% 50% at 48% 108%, rgba(0, 86, 179, 0.28), transparent 62%),
        linear-gradient(168deg, #b7cce8 0%, #9eb8dc 42%, #7fa3d0 78%, #6d94c4 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 60%, rgba(197, 204, 216, 0.5) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 64px 64px;
      opacity: 0.4;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: min(72rem, 100%);
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
    }

    .board {
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.55);
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.78) 0%, rgba(236, 244, 255, 0.62) 100%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(28px) saturate(1.25);
      padding: 1.35rem 1.15rem 1.5rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }

    .logo {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-kicker {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.65;
    }

    h1 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink-900);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .home-btn,
    .today-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.85);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .today-btn {
      background: var(--navy);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 18px rgba(0, 35, 102, 0.22);
    }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.85);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .pdf-btn:hover {
      background: #fff;
      border-color: rgba(0, 35, 102, 0.28);
      transform: translateY(-1px);
    }

    .pdf-btn:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.35);
      outline-offset: 2px;
    }

    .pdf-btn svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    .pdf-btn[disabled] {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .mode-toggle {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      gap: 0.15rem;
    }

    .mode-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-700);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .mode-btn:hover {
      background: rgba(0, 35, 102, 0.06);
    }

    .mode-btn:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.35);
      outline-offset: 2px;
    }

    .mode-btn.is-active {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 6px 14px rgba(0, 35, 102, 0.2);
    }

    .board[data-calendar-mode="academic"] .mode-btn.is-active {
      background: var(--cal-testing);
      box-shadow: 0 6px 14px rgba(14, 116, 144, 0.24);
    }

    @media (max-width: 720px) {
      .topbar {
        flex-wrap: wrap;
      }

      .topbar-actions {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .mode-toggle {
        order: -1;
        width: 100%;
        justify-content: stretch;
      }

      .mode-btn {
        flex: 1;
        text-align: center;
      }
    }

    .home-btn svg,
    .today-btn svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    .home-btn:hover {
      background: #fff;
      border-color: rgba(0, 35, 102, 0.28);
    }

    .today-btn:hover {
      background: var(--royal);
      transform: translateY(-1px);
    }

    .home-btn:focus-visible,
    .today-btn:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.4);
      outline-offset: 3px;
    }

    .lead {
      font-size: 0.92rem;
      color: var(--ink-500);
      margin-bottom: 0.85rem;
      max-width: 40rem;
    }

    .status-line {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-400);
      margin-bottom: 0.9rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .legend-item {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.55);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink-700);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    }

    .legend-item:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 35, 102, 0.28);
      transform: translateY(-1px);
    }

    .legend-item:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.35);
      outline-offset: 2px;
    }

    .legend-item.is-active {
      background: rgba(0, 35, 102, 0.1);
      border-color: rgba(0, 35, 102, 0.42);
      box-shadow: inset 0 0 0 1px rgba(0, 35, 102, 0.12);
      color: var(--navy);
    }

    .legend-item[data-filter="testing"].is-active {
      background: rgba(14, 116, 144, 0.12);
      border-color: rgba(14, 116, 144, 0.45);
      color: #0e4f5c;
    }

    .swatch {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 0.28rem;
      border: 1px solid rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .swatch.white { background: var(--cal-white-bg); }
    .swatch.blue { background: var(--cal-blue-bg); }
    .swatch.closed { background: var(--cal-closed-bg); }
    .swatch.planning { background: var(--cal-planning-bg); }
    .swatch.erd {
      background: var(--cal-erd-bg);
      border-color: var(--cal-erd-border);
    }
    .swatch.exam {
      background: linear-gradient(90deg, var(--cal-exam-gold) 50%, var(--cal-blue-bg) 50%);
    }
    .swatch.testing {
      background: var(--cal-testing);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
    }
    .swatch.acat-pm-fast { background: var(--acat-pm-fast); }
    .swatch.acat-ctace { background: var(--acat-ctace); }
    .swatch.acat-ap { background: var(--acat-ap); }
    .swatch.acat-retakes { background: var(--acat-retakes); }
    .swatch.acat-wida { background: var(--acat-wida); }
    .swatch.acat-psat { background: var(--acat-psat); }
    .swatch.acat-act { background: var(--acat-act); }
    .swatch.acat-sat { background: var(--acat-sat); }
    .swatch.acat-map { background: var(--acat-map); }
    .swatch.acat-government { background: var(--acat-government); }
    .swatch.acat-training { background: var(--acat-training); }
    .swatch.acat-infrastructure { background: var(--acat-infrastructure); }
    .swatch.acat-multi {
      background: linear-gradient(135deg, var(--acat-multi-a) 50%, var(--acat-multi-b) 50%);
    }

    .layout {
      display: grid;
      gap: 1rem;
    }

    .detail-panel {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 35, 102, 0.12);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-soft);
      padding: 1rem 1rem 1.1rem;
      min-height: 9rem;
      z-index: 5;
    }

    .detail-panel.is-updating {
      animation: detail-priority-pulse 0.55s ease;
    }

    @keyframes detail-priority-pulse {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-2px) scale(1.015); }
      100% { transform: translateY(0) scale(1); }
    }

    /* Phone / tablet: keep the day info docked in view while scrolling months */
    @media (max-width: 899px) {
      .layout {
        display: block;
      }

      .months {
        padding-bottom: calc(min(40vh, 20rem) + 1.75rem + env(safe-area-inset-bottom, 0px));
      }

      .detail-panel {
        position: fixed;
        left: 0.7rem;
        right: 0.7rem;
        bottom: calc(0.7rem + env(safe-area-inset-bottom, 0px));
        z-index: 60;
        min-height: 0;
        max-height: min(40vh, 20rem);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 18px 40px rgba(0, 35, 102, 0.28),
          0 0 0 1px rgba(0, 35, 102, 0.08);
        backdrop-filter: blur(18px) saturate(1.2);
        -webkit-backdrop-filter: blur(18px) saturate(1.2);
      }

      .detail-panel[data-mode="filter"] {
        max-height: min(48vh, 24rem);
      }

      .detail-panel::before {
        content: "";
        display: block;
        width: 2.4rem;
        height: 0.28rem;
        border-radius: 999px;
        background: rgba(0, 35, 102, 0.22);
        margin: 0 auto 0.7rem;
      }

      .detail-panel[data-tone="blue"]::before,
      .detail-panel[data-tone="closed"]::before,
      .detail-panel[data-tone="planning"]::before,
      .detail-panel[data-tone="psd"]::before,
      .detail-panel[data-tone^="acat-"]::before {
        background: rgba(255, 255, 255, 0.45);
      }
    }

    /* Desktop: sticky sidebar stays visible while the month grid scrolls */
    @media (min-width: 900px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 18rem;
        align-items: start;
      }

      .detail-panel {
        position: sticky;
        top: 1rem;
        align-self: start;
        max-height: calc(100dvh - 2rem);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        box-shadow:
          var(--shadow-soft),
          0 0 0 1px rgba(0, 35, 102, 0.06);
      }
    }

    .months {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr));
      gap: 0.85rem;
    }

    .month-card {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 35, 102, 0.1);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      padding: 0.85rem 0.7rem 0.75rem;
    }

    .month-title {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.55rem;
      padding: 0 0.2rem;
    }

    .month-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.2rem;
      margin-bottom: 0.25rem;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-400);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.22rem;
    }

    .cal-day {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(232, 238, 246, 0.55);
      color: var(--ink-400);
      border-radius: 0.55rem;
      min-height: 2.15rem;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cal-day.is-pad {
      visibility: hidden;
      pointer-events: none;
    }

    .cal-day-num {
      position: relative;
      z-index: 1;
    }

    .cal-day.tone-white {
      background: var(--cal-white-bg);
      border-color: var(--cal-white-border);
      color: var(--cal-white-ink);
    }

    .cal-day.tone-blue {
      background: var(--cal-blue-bg);
      border-color: rgba(0, 30, 100, 0.45);
      color: var(--cal-blue-ink);
    }

    .cal-day.tone-closed {
      background: var(--cal-closed-bg);
      border-color: rgba(40, 80, 30, 0.35);
      color: var(--cal-closed-ink);
    }

    .cal-day.tone-planning,
    .cal-day.tone-psd {
      background: var(--cal-planning-bg);
      border-color: rgba(140, 50, 10, 0.35);
      color: var(--cal-planning-ink);
    }

    .cal-day.tone-erd {
      background: var(--cal-erd-bg);
      border-color: var(--cal-erd-border);
      color: var(--cal-erd-ink);
    }

    .cal-day.is-exam {
      box-shadow: inset 0 0 0 2px rgba(230, 176, 0, 0.95);
    }

    .cal-day.is-exam.tone-white {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold) 0%,
        var(--cal-exam-gold) 48%,
        #ffffff 52%,
        #ffffff 100%
      );
    }

    .cal-day.is-exam.tone-blue {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold-deep) 0%,
        var(--cal-exam-gold-deep) 48%,
        var(--cal-blue-bg) 52%,
        var(--cal-blue-bg) 100%
      );
      color: #fff;
    }

    .cal-day.is-exam.tone-erd {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold) 0%,
        var(--cal-exam-gold) 48%,
        var(--cal-erd-bg) 52%,
        var(--cal-erd-bg) 100%
      );
    }

    .cal-day.has-testing .testing-mark {
      position: absolute;
      top: 0.22rem;
      right: 0.22rem;
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 999px;
      background: var(--cal-testing);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
      z-index: 2;
    }

    .cal-day.tone-blue.has-testing .testing-mark,
    .cal-day.tone-closed.has-testing .testing-mark,
    .cal-day.tone-planning.has-testing .testing-mark,
    .cal-day.tone-psd.has-testing .testing-mark {
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.35);
      background: #67e8f9;
    }

    .cal-day.tone-acat-pm-fast { background: var(--acat-pm-fast); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-ctace { background: var(--acat-ctace); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-ap { background: var(--acat-ap); color: #fff; border-color: rgba(0, 0, 0, 0.18); }
    .cal-day.tone-acat-retakes { background: var(--acat-retakes); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-wida { background: var(--acat-wida); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-psat { background: var(--acat-psat); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-act { background: var(--acat-act); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-sat { background: var(--acat-sat); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-map { background: var(--acat-map); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-government { background: var(--acat-government); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-training { background: var(--acat-training); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-infrastructure { background: var(--acat-infrastructure); color: #fff; border-color: rgba(0, 0, 0, 0.12); }
    .cal-day.tone-acat-multi {
      background: linear-gradient(135deg, var(--acat-multi-a) 0 50%, var(--acat-multi-b) 50% 100%);

      border-color: rgba(0, 0, 0, 0.14);
    }

    .board[data-calendar-mode="academic"] .cal-day.tone-empty {
      background: rgba(255, 255, 255, 0.35);
      color: rgba(0, 35, 102, 0.35);
      border-color: transparent;
    }

    .detail-panel[data-tone="acat-pm-fast"],
    .detail-panel[data-tone="acat-ctace"],
    .detail-panel[data-tone="acat-ap"],
    .detail-panel[data-tone="acat-retakes"],
    .detail-panel[data-tone="acat-wida"],
    .detail-panel[data-tone="acat-psat"],
    .detail-panel[data-tone="acat-act"],
    .detail-panel[data-tone="acat-sat"],
    .detail-panel[data-tone="acat-map"],
    .detail-panel[data-tone="acat-government"],
    .detail-panel[data-tone="acat-training"],
    .detail-panel[data-tone="acat-infrastructure"] {
      color: #fff;
      border-color: rgba(0, 0, 0, 0.12);
    }

    .detail-panel[data-tone="acat-pm-fast"] { background: linear-gradient(165deg, #1494b5 0%, var(--acat-pm-fast) 100%); }
    .detail-panel[data-tone="acat-ctace"] { background: linear-gradient(165deg, #1d7a96 0%, var(--acat-ctace) 100%); }
    .detail-panel[data-tone="acat-ap"] { background: linear-gradient(165deg, #0a4cc4 0%, var(--acat-ap) 100%); }
    .detail-panel[data-tone="acat-retakes"] { background: linear-gradient(165deg, #d97706 0%, var(--acat-retakes) 100%); }
    .detail-panel[data-tone="acat-wida"] { background: linear-gradient(165deg, #4d7c0f 0%, var(--acat-wida) 100%); }
    .detail-panel[data-tone="acat-psat"] { background: linear-gradient(165deg, #1d6fd1 0%, var(--acat-psat) 100%); }
    .detail-panel[data-tone="acat-act"] { background: linear-gradient(165deg, #be123c 0%, var(--acat-act) 100%); }
    .detail-panel[data-tone="acat-sat"] { background: linear-gradient(165deg, #2746a8 0%, var(--acat-sat) 100%); }
    .detail-panel[data-tone="acat-map"] { background: linear-gradient(165deg, #65a30d 0%, var(--acat-map) 100%); }
    .detail-panel[data-tone="acat-government"] { background: linear-gradient(165deg, #b45309 0%, var(--acat-government) 100%); }
    .detail-panel[data-tone="acat-training"] { background: linear-gradient(165deg, #94a3b8 0%, var(--acat-training) 100%); }
    .detail-panel[data-tone="acat-infrastructure"] { background: linear-gradient(165deg, #64748b 0%, var(--acat-infrastructure) 100%); }

    .detail-panel[data-tone^="acat-"] .testing-block {
      border-top-color: rgba(255, 255, 255, 0.28);
    }

    .detail-panel[data-tone^="acat-"] .testing-heading,
    .detail-panel[data-tone^="acat-"] .testing-cat {
      color: #ecfeff;
    }

    .detail-panel[data-tone^="acat-"] .testing-item {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .detail-panel[data-tone^="acat-"] .detail-meta {
      border-top-color: rgba(255, 255, 255, 0.25);
    }

    .cal-day.is-today {
      outline: 2px dashed rgba(0, 86, 179, 0.75);
      outline-offset: 2px;
    }

    .cal-day.is-selected {
      transform: scale(1.14);
      z-index: 3;
      box-shadow:
        0 0 0 3px #ffffff,
        0 0 0 6px var(--navy),
        0 10px 22px rgba(0, 35, 102, 0.38);
    }

    .cal-day.is-today.is-selected {
      outline: 2px solid rgba(0, 86, 179, 0.9);
      outline-offset: 7px;
    }

    .cal-day.tone-blue.is-selected,
    .cal-day.tone-closed.is-selected,
    .cal-day.tone-planning.is-selected,
    .cal-day.tone-psd.is-selected,
    .cal-day[class*="tone-acat-"].is-selected {
      box-shadow:
        0 0 0 3px #ffffff,
        0 0 0 6px #f59e0b,
        0 10px 22px rgba(0, 35, 102, 0.4);
    }

    .cal-day:hover:not(.is-pad):not(.is-selected) {
      transform: translateY(-1px);
    }

    .cal-day.is-selected:hover {
      transform: scale(1.14);
    }

    .cal-day:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.45);
      outline-offset: 2px;
    }

    .cal-day.is-selected:focus-visible {
      outline-offset: 8px;
    }

    .detail-panel[data-tone="blue"] {
      background: linear-gradient(165deg, #0a4cc4 0%, var(--cal-blue-bg) 100%);
      color: #fff;
      border-color: rgba(0, 30, 100, 0.45);
    }

    .detail-panel[data-tone="white"] {
      background: #fff;
      color: var(--cal-white-ink);
    }

    .detail-panel[data-tone="closed"] {
      background: linear-gradient(165deg, #5f8f42 0%, var(--cal-closed-bg) 100%);
      color: #fff;
    }

    .detail-panel[data-tone="planning"],
    .detail-panel[data-tone="psd"] {
      background: linear-gradient(165deg, #d96a28 0%, var(--cal-planning-bg) 100%);
      color: #fff;
    }

    .detail-panel[data-tone="erd"] {
      background: var(--cal-erd-bg);
      color: var(--cal-erd-ink);
      border-color: var(--cal-erd-border);
    }

    .detail-panel[data-exam="true"][data-tone="white"] {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold) 0%,
        var(--cal-exam-gold) 42%,
        #ffffff 42%,
        #ffffff 100%
      );
    }

    .detail-panel[data-exam="true"][data-tone="blue"] {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold-deep) 0%,
        var(--cal-exam-gold-deep) 42%,
        var(--cal-blue-bg) 42%,
        var(--cal-blue-bg) 100%
      );
    }

    .detail-eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.78;
      margin-bottom: 0.35rem;
    }

    .detail-title {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .detail-body {
      font-size: 0.92rem;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      opacity: 0.92;
    }

    .detail-meta {
      display: grid;
      gap: 0.15rem;
      font-size: 0.82rem;
      line-height: 1.35;
      margin-top: 0.45rem;
      padding-top: 0.45rem;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .detail-meta span {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .detail-panel[data-tone="blue"] .detail-meta,
    .detail-panel[data-tone="closed"] .detail-meta,
    .detail-panel[data-tone="planning"] .detail-meta,
    .detail-panel[data-tone="psd"] .detail-meta {
      border-top-color: rgba(255, 255, 255, 0.25);
    }

    .testing-block {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(14, 116, 144, 0.28);
    }

    .detail-panel[data-tone="blue"] .testing-block,
    .detail-panel[data-tone="closed"] .testing-block,
    .detail-panel[data-tone="planning"] .testing-block,
    .detail-panel[data-tone="psd"] .testing-block {
      border-top-color: rgba(255, 255, 255, 0.28);
    }

    .testing-heading {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cal-testing);
      margin-bottom: 0.45rem;
    }

    .detail-panel[data-tone="blue"] .testing-heading,
    .detail-panel[data-tone="closed"] .testing-heading,
    .detail-panel[data-tone="planning"] .testing-heading,
    .detail-panel[data-tone="psd"] .testing-heading {
      color: #a5f3fc;
    }

    .testing-list {
      list-style: none;
      display: grid;
      gap: 0.45rem;
    }

    .testing-item {
      display: grid;
      gap: 0.12rem;
      padding: 0.45rem 0.55rem;
      border-radius: 0.65rem;
      background: var(--cal-testing-soft);
      border: 1px solid rgba(14, 116, 144, 0.18);
    }

    .detail-panel[data-tone="blue"] .testing-item,
    .detail-panel[data-tone="closed"] .testing-item,
    .detail-panel[data-tone="planning"] .testing-item,
    .detail-panel[data-tone="psd"] .testing-item {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .testing-cat {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cal-testing);
    }

    .detail-panel[data-tone="blue"] .testing-cat,
    .detail-panel[data-tone="closed"] .testing-cat,
    .detail-panel[data-tone="planning"] .testing-cat,
    .detail-panel[data-tone="psd"] .testing-cat {
      color: #cffafe;
    }

    .testing-item-title {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .testing-item-detail {
      font-size: 0.78rem;
      line-height: 1.35;
      opacity: 0.88;
    }

    .detail-panel[data-mode="filter"] {
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink-900);
      border-color: rgba(0, 35, 102, 0.14);
      overflow: auto;
    }

    @media (min-width: 900px) {
      .detail-panel[data-mode="filter"] {
        max-height: calc(100dvh - 2rem);
      }
    }

    .upcoming-list {
      list-style: none;
      display: grid;
      gap: 0.4rem;
      margin-top: 0.65rem;
    }

    .upcoming-item {
      appearance: none;
      width: 100%;
      text-align: left;
      display: grid;
      gap: 0.15rem;
      padding: 0.55rem 0.65rem;
      border-radius: 0.7rem;
      border: 1px solid rgba(0, 35, 102, 0.12);
      background: rgba(248, 251, 255, 0.95);
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease, background 0.15s ease;
    }

    .upcoming-item:hover {
      border-color: rgba(0, 35, 102, 0.32);
      background: #fff;
      transform: translateY(-1px);
    }

    .upcoming-item:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.35);
      outline-offset: 2px;
    }

    .upcoming-date {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-500);
    }

    .upcoming-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink-900);
    }

    .upcoming-meta {
      font-size: 0.76rem;
      line-height: 1.35;
      color: var(--ink-500);
    }

    .upcoming-empty {
      margin-top: 0.55rem;
      font-size: 0.88rem;
      color: var(--ink-500);
      line-height: 1.4;
    }

    .cal-error {
      grid-column: 1 / -1;
      padding: 1rem;
      color: var(--ink-700);
    }

    .cal-error a {
      color: var(--royal);
      font-weight: 700;
    }

    footer {
      position: relative;
      z-index: 1;
      width: min(72rem, 100%);
      margin: 0 auto;
      padding: 0 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      color: rgba(0, 35, 102, 0.78);
      font-size: 0.78rem;
    }

    footer a {
      color: inherit;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .board {
        padding: 1.1rem 0.8rem 1.25rem;
      }

      .cal-day {
        min-height: 2rem;
        font-size: 0.72rem;
        border-radius: 0.45rem;
      }

      .months {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cal-day,
      .home-btn,
      .detail-panel.is-updating {
        transition: none;
        animation: none;
      }
    }

</head>
<body>
  <div class="page">
    <main>
      <section class="board" aria-labelledby="cal-title">
        <div class="topbar">
          <div class="brand-lockup">
            <img
              class="logo"
              src="../assets/brand/logo.png"
              width="88"
              height="88"
              alt="Fort Lauderdale High School"
            />
            <div class="brand-text">
              <p class="brand-kicker">FLHSHelp</p>
              <h1 id="cal-title">School Calendar</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <div class="mode-toggle" id="cal-mode-toggle" role="group" aria-label="Calendar mode">
              <button type="button" class="mode-btn is-active" data-mode="school" aria-pressed="true">
                School
              </button>
              <button type="button" class="mode-btn" data-mode="academic" aria-pressed="false">
                Academic Testing
              </button>
            </div>
            <button type="button" class="pdf-btn" id="cal-pdf-btn" aria-label="Download PDF of the current calendar view">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3v11.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <path d="m8.5 11.5 3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 19.25h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
              PDF
            </button>
            <button type="button" class="today-btn" id="cal-today-btn" aria-label="Jump to today">
              Today
            </button>
            <a class="home-btn" href="../index.html">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4.5 11.25 12 4.75l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 10.75V19a.75.75 0 0 0 .75.75h3.5v-4.5h2.5v4.5h3.5A.75.75 0 0 0 18 19v-8.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Home
            </a>
          </div>
        </div>

        <p class="lead" id="cal-lead">
          2026–2027 FLHS days colored to match the official calendar legend. Tap a legend chip for upcoming dates from today, or tap a day for schedule details.
        </p>
        <p class="status-line" id="cal-status" role="status">Loading calendar…</p>

        <div class="legend" id="cal-legend" role="toolbar" aria-label="School calendar legend filters"></div>

        <div class="layout">
          <div id="cal-months" class="months" aria-live="polite"></div>
          <aside
            id="cal-detail"
            class="detail-panel"
            aria-live="polite"
            hidden
          ></aside>
        </div>
      </section>
    </main>

    <footer>
      <p>
        <strong>FLHSHelp.com</strong> · IT Support · Fort Lauderdale High School
      </p>
      <a href="mailto:rajesh.ramautar@browardschools.com">Email the IT Specialist</a>
    </footer>
  </div>

  <script src="../js/calendar.js?v=81" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
