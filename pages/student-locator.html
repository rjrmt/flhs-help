<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FLHS Test Room Locator — enter your student number to see where to go for testing." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FLHS Help" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Test Room Locator | FLHSHelp</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-50: #e8f0fa;
      --sky-100: #c5d6ef;
      --sky-200: #9eb8dc;
      --navy: #002366;
      --royal: #0056b3;
      --blue-500: #0056b3;
      --blue-600: #004a9c;
      --blue-700: #003d82;
      --ink-900: #002366;
      --ink-700: #1a3a6e;
      --ink-500: #3d5680;
      --ink-400: #5a7194;
      --border: rgba(197, 204, 216, 0.65);
      --shadow: 0 28px 64px rgba(0, 35, 102, 0.22), 0 10px 24px rgba(0, 35, 102, 0.12);
      --radius-xl: 1.75rem;
      --radius-lg: 1.25rem;
      --radius-md: 1rem;
      --err-bg: #fff1f2;
      --err-border: #fecdd3;
      --err-ink: #be123c;
      --warn-bg: #fff7ed;
      --warn-border: #fdba74;
      --warn-ink: #9a3412;
      --ok-bg: #ecfdf5;
      --ok-border: #6ee7b7;
      --ok-ink: #065f46;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink-900);
      background: var(--sky-200);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 95% 70% at 6% -12%, rgba(0, 86, 179, 0.38), transparent 58%),
        radial-gradient(ellipse 80% 60% at 98% 0%, rgba(0, 35, 102, 0.32), transparent 55%),
        radial-gradient(ellipse 70% 50% at 48% 108%, rgba(0, 86, 179, 0.28), transparent 62%),
        linear-gradient(168deg, #b7cce8 0%, #9eb8dc 42%, #7fa3d0 78%, #6d94c4 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 60%, rgba(197, 204, 216, 0.5) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 64px 64px;
      opacity: 0.4;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 3.5vw, 2.5rem);
    }

    .board-stage {
      position: relative;
      width: min(100%, 30rem);
      animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .board-floor {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -0.35rem;
      height: 2.5rem;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(
        ellipse 70% 55% at 50% 40%,
        rgba(0, 35, 102, 0.35) 0%,
        rgba(0, 86, 179, 0.16) 45%,
        transparent 72%
      );
      filter: blur(12px);
      transform: scaleY(0.5);
    }

    .board {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: clamp(1.5rem, 4.5vw, 2.15rem) clamp(1.15rem, 3.8vw, 1.85rem)
        clamp(1.35rem, 3.5vw, 1.85rem);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(244, 248, 255, 0.78) 48%,
          rgba(232, 240, 250, 0.7) 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.98),
        0 0 0 1px rgba(197, 204, 216, 0.28),
        var(--shadow);
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(28px) saturate(1.25);
      text-align: center;
    }

    .logo {
      width: clamp(4.75rem, 18vw, 5.75rem);
      height: auto;
      display: block;
      margin: 0 auto 0.85rem;
      filter: drop-shadow(0 10px 18px rgba(45, 90, 160, 0.18));
    }

    h1 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(1.55rem, 5vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--navy);
      margin-bottom: 0.45rem;
    }

    .lead {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-500);
      margin-bottom: 1.15rem;
      text-wrap: balance;
    }

    .search-form {
      display: flex;
      gap: 0.55rem;
      align-items: stretch;
      margin-bottom: 0.85rem;
    }

    .field {
      flex: 1;
      min-width: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .search-input {
      width: 100%;
      height: 2.85rem;
      padding: 0 0.95rem;
      border-radius: 0.85rem;
      border: 1.5px solid rgba(0, 35, 102, 0.28);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink-900);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--blue-600);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 1),
        0 0 0 3px rgba(47, 111, 237, 0.22);
    }

    .search-btn {
      flex-shrink: 0;
      height: 2.85rem;
      padding: 0 1.15rem;
      border: none;
      border-radius: 0.85rem;
      background: linear-gradient(180deg, #1a4bb8 0%, var(--navy) 100%);
      color: #fff;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 8px 18px rgba(0, 35, 102, 0.22);
    }

    .search-btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status-line {
      min-height: 1.25rem;
      margin-bottom: 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-400);
    }

    .status-line[data-tone="error"] { color: var(--err-ink); }
    .status-line[data-tone="ok"] { color: var(--ok-ink); }

    .results {
      text-align: left;
      margin-bottom: 1rem;
      padding: 0.95rem;
      border-radius: var(--radius-lg);
      border: 1.5px solid rgba(0, 35, 102, 0.14);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .results[hidden] { display: none; }

    .identity {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 0.95rem;
      padding-bottom: 0.85rem;
      border-bottom: 1.5px solid rgba(0, 35, 102, 0.1);
    }

    .id-row {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 0.55rem;
      align-items: baseline;
    }

    .id-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-500);
    }

    .id-value {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .id-value.muted {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 650;
      color: var(--royal);
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 0.65rem;
    }

    .exam-cards {
      display: grid;
      gap: 0.7rem;
    }

    .exam-card {
      padding: 0.85rem 0.8rem;
      border-radius: 0.9rem;
      border: 1.5px solid rgba(0, 35, 102, 0.14);
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.95) 0%, rgba(232, 242, 255, 0.72) 100%);
      box-shadow: 0 8px 18px rgba(0, 35, 102, 0.08);
    }

    .exam-title {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 0.7rem;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem 0.7rem;
    }

    @media (min-width: 420px) {
      .exam-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .exam-mini-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 0.15rem;
    }

    .exam-mini-value {
      font-size: 0.92rem;
      font-weight: 750;
      color: var(--royal);
      word-break: break-word;
      line-height: 1.25;
    }

    .exam-mini.is-room .exam-mini-value {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--navy);
    }

    .note {
      margin-top: 0.85rem;
      padding: 0.7rem 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(0, 86, 179, 0.22);
      background: rgba(0, 86, 179, 0.08);
      color: var(--ink-700);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
    }

    .note.is-warn {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-ink);
    }

    .note.is-error {
      border-color: var(--err-border);
      background: var(--err-bg);
      color: var(--err-ink);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-width: 8.5rem;
      height: 2.7rem;
      padding: 0 1.25rem;
      border-radius: 0.85rem;
      border: none;
      background: linear-gradient(180deg, #1a4bb8 0%, var(--navy) 100%);
      color: #fff;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 8px 18px rgba(0, 35, 102, 0.2);
    }

    .home-btn svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      padding: 0.85rem 1.5rem 1.65rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(0, 35, 102, 0.78);
    }

    footer strong { color: var(--navy); font-weight: 700; }

    .footer-credit {
      color: var(--navy);
      font-weight: 700;
      text-decoration: none;
    }

    .footer-credit:hover { text-decoration: underline; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .search-form { flex-direction: column; }
      .search-btn { width: 100%; }
      .id-row { grid-template-columns: 1fr; gap: 0.15rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="board-stage">
        <div class="board-floor" aria-hidden="true"></div>
        <section class="board" aria-labelledby="locator-title">
          <img
            class="logo"
            src="../assets/brand/logo.png"
            width="160"
            height="160"
            alt="Fort Lauderdale High School"
          />
          <h1 id="locator-title">Test Room Locator</h1>
          <p class="lead">Enter your student number to see your testing room and schedule.</p>

          <form class="search-form" id="locator-form" autocomplete="off">
            <div class="field">
              <label class="sr-only" for="student-number">Student number</label>
              <input
                class="search-input"
                id="student-number"
                name="studentNumber"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="10"
                placeholder="Student Number"
                required
                autofocus
              />
            </div>
            <button class="search-btn" type="submit" id="search-btn">Search</button>
          </form>

          <p class="status-line" id="status-line" role="status" aria-live="polite"></p>

          <div class="results" id="results" aria-live="polite" hidden>
            <div class="identity">
              <div class="id-row">
                <span class="id-label">Name</span>
                <span class="id-value" id="out-name">—</span>
              </div>
              <div class="id-row">
                <span class="id-label">Grade</span>
                <span class="id-value muted" id="out-grade">—</span>
              </div>
            </div>

            <p class="section-title" id="assignments-heading">Your scheduled exams</p>
            <div class="exam-cards" id="exam-cards"></div>
            <p class="note" id="note-message">Screenshot this for your records</p>
          </div>

          <a class="home-btn" href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 11.25 12 4.75l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 10.75V19a.75.75 0 0 0 .75.75h3.5v-4.5h2.5v4.5h3.5A.75.75 0 0 0 18 19v-8.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Home
          </a>
        </section>
      </div>
    </main>

    <footer>
      <p>
        <strong>FLHSHelp.com</strong> · IT Support · Fort Lauderdale High School
        <br />
        <a class="footer-credit" href="meet-rj.html">Designed by IT Specialist RJ</a>
      </p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/flhs-db.js"></script>
  <script>
    (() => {
      const STUDENT_ID_LEN = 10;
      const AUTO_SEARCH_MS = 160;

      const form = document.getElementById("locator-form");
      const input = document.getElementById("student-number");
      const searchBtn = document.getElementById("search-btn");
      const statusLine = document.getElementById("status-line");
      const results = document.getElementById("results");
      const outName = document.getElementById("out-name");
      const outGrade = document.getElementById("out-grade");
      const examCards = document.getElementById("exam-cards");
      const assignmentsHeading = document.getElementById("assignments-heading");
      const noteMessage = document.getElementById("note-message");

      let autoSearchTimer = 0;
      let lastAutoSearched = "";
      let searchInFlight = false;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function digitsOnly(value) {
        return String(value || "").replace(/\D/g, "");
      }

      function normalizeStudentId(raw) {
        const digits = digitsOnly(raw);
        if (!digits) return "";
        if (digits.length < STUDENT_ID_LEN) return digits.padStart(STUDENT_ID_LEN, "0");
        return digits;
      }

      function setStatus(message, tone = "") {
        statusLine.textContent = message || "";
        if (tone) statusLine.dataset.tone = tone;
        else delete statusLine.dataset.tone;
      }

      function formatExamTitle(raw) {
        const s = String(raw || "").trim();
        if (!s) return "—";
        const upper = s.toUpperCase();
        const map = {
          PM1: "PM1",
          "MATH RETAKES": "Math Retakes",
          "READING RETAKES": "Reading Retakes",
          "ALL OTHER RETAKES": "All Other Retakes",
        };
        if (map[upper]) return map[upper];
        return s.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
      }

      function formatDisplayDate(iso) {
        const s = String(iso || "").trim();
        if (!s) return "—";
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return s;
        return `${Number(m[2])}/${Number(m[3])}/${m[1]}`;
      }

      function titleCaseDay(raw) {
        const s = String(raw || "").trim();
        if (!s) return "—";
        return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
      }

      function studentName(row) {
        const last = String(row.last_name || "").trim();
        const first = String(row.first_name || "").trim();
        if (last && first) return `${last}, ${first}`;
        return last || first || "—";
      }

      async function lookupAssignments(studentId) {
        const db = window.flhsCreateDb();
        const { data, error } = await db.rpc("lookup_test_assignments", {
          p_student_id: studentId,
        });
        if (error) throw error;
        return Array.isArray(data) ? data : data ? [data] : [];
      }

      function renderExams(rows) {
        if (!rows.length) {
          assignmentsHeading.hidden = true;
          examCards.innerHTML = "";
          noteMessage.className = "note is-warn";
          noteMessage.textContent =
            "No exam scheduled at this time. Check back later or ask your counselor.";
          return;
        }

        assignmentsHeading.hidden = false;
        examCards.innerHTML = rows
          .map((row) => {
            const exam = formatExamTitle(row.exam);
            const day = titleCaseDay(row.day);
            const date = formatDisplayDate(row.exam_date);
            const session = String(row.session || "").trim().toUpperCase() || "—";
            const room = String(row.room || "").trim() || "—";
            return `
          <article class="exam-card">
            <h2 class="exam-title">${escapeHtml(exam)}</h2>
            <div class="exam-grid">
              <div>
                <div class="exam-mini-label">Day</div>
                <div class="exam-mini-value">${escapeHtml(day)}</div>
              </div>
              <div>
                <div class="exam-mini-label">Date</div>
                <div class="exam-mini-value">${escapeHtml(date)}</div>
              </div>
              <div>
                <div class="exam-mini-label">Session</div>
                <div class="exam-mini-value">${escapeHtml(session)}</div>
              </div>
              <div class="exam-mini is-room">
                <div class="exam-mini-label">Room</div>
                <div class="exam-mini-value">${escapeHtml(room)}</div>
              </div>
            </div>
          </article>`;
          })
          .join("");
        noteMessage.className = "note";
        noteMessage.textContent = "Screenshot this for your records";
      }

      function showNotFound(studentId) {
        results.hidden = false;
        outName.textContent = "Student not found";
        outGrade.textContent = "—";
        assignmentsHeading.hidden = true;
        examCards.innerHTML = "";
        noteMessage.className = "note is-error";
        noteMessage.textContent = `No testing record for ${studentId}. Check the number and try again.`;
      }

      function showStudent(rows) {
        results.hidden = false;
        outName.textContent = studentName(rows[0]);
        outGrade.textContent = String(rows[0].grade || "").trim() || "—";
        renderExams(rows);
      }

      async function runSearch() {
        const digits = digitsOnly(input.value);
        if (!digits) {
          input.focus();
          return;
        }

        if (searchInFlight) return;
        searchInFlight = true;
        searchBtn.disabled = true;

        try {
          const studentId = normalizeStudentId(digits);
          if (digits.length < STUDENT_ID_LEN) {
            setStatus("Enter the full 10-digit student number");
            results.hidden = true;
            return;
          }

          setStatus("Searching…");
          const rows = await lookupAssignments(studentId);
          if (rows.length) {
            showStudent(rows);
            setStatus("");
          } else {
            showNotFound(studentId);
            setStatus("");
          }
        } catch (err) {
          console.error(err);
          results.hidden = true;
          setStatus("Could not look up this ID. Check your connection and try again.", "error");
        } finally {
          searchInFlight = false;
          searchBtn.disabled = false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        runSearch();
      });

      input.addEventListener("input", () => {
        const digits = digitsOnly(input.value);
        if (input.value !== digits) input.value = digits;
        window.clearTimeout(autoSearchTimer);
        if (!digits) {
          results.hidden = true;
          setStatus("");
          lastAutoSearched = "";
          return;
        }
        if (digits.length === STUDENT_ID_LEN && digits !== lastAutoSearched) {
          autoSearchTimer = window.setTimeout(() => {
            lastAutoSearched = digits;
            runSearch();
          }, AUTO_SEARCH_MS);
        }
      });

      const params = new URLSearchParams(window.location.search);
      const preset = digitsOnly(params.get("id") || "");
      if (preset) {
        input.value = preset;
        if (preset.length === STUDENT_ID_LEN) runSearch();
      }
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../sw.js").catch(() => {});
      });
    }
  </script>
</body>
