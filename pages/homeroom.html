<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FLHS Homeroom Locator — find your White Day and Blue Day homeroom by student number." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FLHS Help" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Homeroom Locator | FLHSHelp</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-50: #e8f0fa;
      --sky-100: #c5d6ef;
      --sky-200: #9eb8dc;
      --navy: #002366;
      --royal: #0056b3;
      --blue-500: #0056b3;
      --blue-600: #004a9c;
      --blue-700: #003d82;
      --ink-900: #002366;
      --ink-700: #1a3a6e;
      --ink-500: #3d5680;
      --ink-400: #5a7194;
      --silver: #c5ccd8;
      --glass: rgba(255, 255, 255, 0.72);
      --border: rgba(197, 204, 216, 0.65);
      --border-soft: rgba(0, 35, 102, 0.16);
      --shadow: 0 28px 64px rgba(0, 35, 102, 0.22), 0 10px 24px rgba(0, 35, 102, 0.12);
      --shadow-soft: 0 12px 30px rgba(0, 35, 102, 0.14);
      --radius-xl: 1.75rem;
      --radius-lg: 1.25rem;
      --radius-md: 1rem;
      --err-bg: #fff1f2;
      --err-border: #fecdd3;
      --err-ink: #be123c;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink-900);
      background: var(--sky-200);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 95% 70% at 6% -12%, rgba(0, 86, 179, 0.38), transparent 58%),
        radial-gradient(ellipse 80% 60% at 98% 0%, rgba(0, 35, 102, 0.32), transparent 55%),
        radial-gradient(ellipse 70% 50% at 48% 108%, rgba(0, 86, 179, 0.28), transparent 62%),
        radial-gradient(ellipse 45% 35% at 78% 42%, rgba(197, 204, 216, 0.35), transparent 70%),
        linear-gradient(168deg, #b7cce8 0%, #9eb8dc 42%, #7fa3d0 78%, #6d94c4 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 60%, rgba(197, 204, 216, 0.5) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 64px 64px;
      opacity: 0.4;
      pointer-events: none;
      animation: drift 36s linear infinite;
    }

    .page::after {
      content: "";
      position: absolute;
      width: min(46rem, 94vw);
      height: min(46rem, 94vw);
      left: 50%;
      top: 42%;
      translate: -50% -50%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.38), transparent 52%),
        radial-gradient(circle, rgba(0, 86, 179, 0.12), transparent 70%);
      pointer-events: none;
      animation: soft-pulse 8s ease-in-out infinite;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 3.5vw, 2.5rem);
      padding-bottom: clamp(1.5rem, 4vw, 2.5rem);
    }

    .board-stage {
      position: relative;
      width: min(100%, 28rem);
      animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .board-floor {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -0.35rem;
      height: 2.5rem;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(
        ellipse 70% 55% at 50% 40%,
        rgba(0, 35, 102, 0.35) 0%,
        rgba(0, 86, 179, 0.16) 45%,
        transparent 72%
      );
      filter: blur(12px);
      transform: scaleY(0.5);
    }

    .board {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: clamp(1.5rem, 4.5vw, 2.15rem) clamp(1.15rem, 3.8vw, 1.85rem)
        clamp(1.35rem, 3.5vw, 1.85rem);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(244, 248, 255, 0.78) 48%,
          rgba(232, 240, 250, 0.7) 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.98),
        inset 0 -1px 0 rgba(0, 35, 102, 0.05),
        0 0 0 1px rgba(197, 204, 216, 0.28),
        var(--shadow);
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(28px) saturate(1.25);
      text-align: center;
    }

    .logo {
      width: clamp(4.75rem, 18vw, 5.75rem);
      height: auto;
      display: block;
      margin: 0 auto 0.85rem;
      filter: drop-shadow(0 10px 18px rgba(45, 90, 160, 0.18));
      animation: logo-settle 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(1.55rem, 5vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--navy);
      margin-bottom: 0.45rem;
    }

    .lead {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-500);
      margin-bottom: 1.35rem;
      text-wrap: balance;
    }

    .search-form {
      display: flex;
      gap: 0.55rem;
      align-items: stretch;
      margin-bottom: 1rem;
    }

    .field {
      flex: 1;
      min-width: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .search-input {
      width: 100%;
      height: 2.85rem;
      padding: 0 0.95rem;
      border-radius: 0.85rem;
      border: 1.5px solid rgba(0, 35, 102, 0.28);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink-900);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-input::placeholder {
      color: var(--ink-400);
      font-weight: 500;
      letter-spacing: 0;
    }

    .search-input:hover {
      border-color: rgba(0, 35, 102, 0.4);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--blue-600);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 1),
        0 0 0 3px rgba(47, 111, 237, 0.22);
    }

    .search-btn {
      flex-shrink: 0;
      height: 2.85rem;
      padding: 0 1.15rem;
      border: none;
      border-radius: 0.85rem;
      background: linear-gradient(180deg, #1a4bb8 0%, var(--navy) 100%);
      color: #fff;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 8px 18px rgba(0, 35, 102, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .search-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 12px 22px rgba(0, 35, 102, 0.26);
    }

    .search-btn:active {
      transform: translateY(0);
    }

    .search-btn:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.45);
      outline-offset: 3px;
    }

    .search-btn:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
      filter: none;
    }

    .results {
      display: none;
      text-align: left;
      border-radius: var(--radius-md);
      border: 1.5px solid rgba(0, 35, 102, 0.18);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
      overflow: hidden;
      margin-bottom: 1.15rem;
      animation: rise-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .results.is-visible {
      display: block;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.72rem 0.95rem;
      border-bottom: 1px solid rgba(0, 35, 102, 0.08);
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-label {
      flex-shrink: 0;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-500);
    }

    .result-value {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
      text-align: right;
      line-height: 1.3;
      word-break: break-word;
    }

    .result-value.is-muted {
      font-weight: 600;
      color: var(--ink-400);
    }

    .result-value.is-error {
      color: var(--err-ink);
    }

    .room-loc {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.12rem;
    }

    .room-loc-line {
      display: block;
      line-height: 1.25;
    }

    .room-loc-building {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
    }

    .room-loc-room {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink-700);
    }

    .room-map-link {
      display: inline-block;
      margin-top: 0.15rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }

    .room-map-link:hover {
      text-decoration: underline;
    }

    .result-block {
      margin: 0.55rem 0.65rem 0.65rem;
      padding: 0.75rem 0.85rem 0.85rem;
      border-radius: 0.85rem;
      border: 1px solid transparent;
    }

    .result-block--white {
      border-color: rgba(0, 35, 102, 0.1);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(248, 250, 252, 0.72) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .result-block--white .result-block-title {
      color: var(--ink-700);
      opacity: 0.78;
    }

    .result-block--blue {
      border-color: rgba(47, 111, 237, 0.22);
      background:
        linear-gradient(180deg, rgba(232, 242, 255, 0.78) 0%, rgba(219, 234, 254, 0.42) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .result-block--blue .result-block-title {
      color: var(--blue-700);
      opacity: 0.85;
    }

    .result-block-title {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.7;
      margin-bottom: 0.45rem;
    }

    .result-block .result-row {
      padding: 0.35rem 0;
      border-bottom: none;
    }

    .result-block--support {
      border-color: rgba(0, 35, 102, 0.1);
      background:
        linear-gradient(180deg, rgba(245, 248, 252, 0.95) 0%, rgba(236, 242, 250, 0.7) 100%);
    }

    .staff-stack {
      display: grid;
      gap: 0.55rem;
    }

    .staff-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem;
      align-items: center;
      padding: 0.55rem 0.6rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 35, 102, 0.08);
      color: inherit;
    }

    .staff-dir-link {
      display: inline-block;
      margin-top: 0.28rem;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--royal);
      text-decoration: none;
    }

    .staff-dir-link:hover {
      text-decoration: underline;
    }

    .staff-photo-wrap {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 999px;
      overflow: hidden;
      background: #e8eef6;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 10px rgba(0, 35, 102, 0.12);
    }

    .staff-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.18);
      transform-origin: center;
    }

    .staff-copy {
      min-width: 0;
    }

    .staff-role {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--royal);
      margin-bottom: 0.1rem;
    }

    .staff-name {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .staff-detail {
      font-size: 0.74rem;
      font-weight: 550;
      color: var(--ink-500);
      margin-top: 0.12rem;
      line-height: 1.3;
    }

    .staff-detail a {
      color: var(--navy);
      font-weight: 800;
      text-decoration: none;
    }

    .staff-detail a:hover {
      text-decoration: underline;
    }

    .error-banner {
      margin: 0.15rem 0.85rem 0.85rem;
      padding: 0.7rem 0.8rem;
      border-radius: 0.75rem;
      border: 1px solid var(--err-border);
      background: var(--err-bg);
      color: var(--err-ink);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: left;
    }

    .status-line {
      min-height: 1.25rem;
      margin-bottom: 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-400);
    }

    .status-line[data-tone="error"] {
      color: var(--err-ink);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-width: 8.5rem;
      height: 2.7rem;
      padding: 0 1.25rem;
      border-radius: 0.85rem;
      border: none;
      background: linear-gradient(180deg, #1a4bb8 0%, var(--navy) 100%);
      color: #fff;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 8px 18px rgba(0, 35, 102, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .home-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .home-btn:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.45);
      outline-offset: 3px;
    }

    .home-btn svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      padding: 0.85rem 1.5rem 1.65rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(0, 35, 102, 0.78);
      animation: rise-in 0.8s ease-out 0.28s both;
    }

    footer strong {
      color: var(--navy);
      font-weight: 700;
    }

    .footer-credit {
      color: var(--navy);
      font-weight: 700;
      text-decoration: none;
    }

    .footer-credit:hover,
    .footer-credit:focus-visible {
      text-decoration: underline;
    }

    .footer-mail {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: rgba(0, 35, 102, 0.78);
      font-weight: 600;
      text-decoration: none;
    }

    .footer-mail:hover,
    .footer-mail:focus-visible {
      color: var(--navy);
    }

    .footer-mail svg {
      width: 1rem;
      height: 1rem;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logo-settle {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 48px 48px, -64px 32px; }
    }

    @keyframes soft-pulse {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.04); }
    }

    @media (max-width: 420px) {
      .search-form {
        flex-direction: column;
      }

      .search-btn {
        width: 100%;
      }

      .result-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15rem;
      }

      .result-value {
        text-align: left;
      }

      .room-loc {
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="board-stage">
        <div class="board-floor" aria-hidden="true"></div>
        <section class="board" aria-labelledby="locator-title">
          <img
            class="logo"
            src="../assets/brand/logo.png"
            width="160"
            height="160"
            alt="Fort Lauderdale High School"
          />
          <h1 id="locator-title">Homeroom Locator</h1>
          <p class="lead">Enter your student number to find your White Day and Blue Day homeroom.</p>

          <form class="search-form" id="homeroom-form" autocomplete="off">
            <div class="field">
              <label class="sr-only" for="student-number">Student number</label>
              <input
                class="search-input"
                id="student-number"
                name="studentNumber"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="10"
                placeholder="Student Number"
                required
                autofocus
              />
            </div>
            <button class="search-btn" type="submit" id="search-btn">Search</button>
          </form>

          <p class="status-line" id="status-line" role="status" aria-live="polite"></p>

          <div class="results" id="results" aria-live="polite" hidden></div>

          <a class="home-btn" href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 11.25 12 4.75l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 10.75V19a.75.75 0 0 0 .75.75h3.5v-4.5h2.5v4.5h3.5A.75.75 0 0 0 18 19v-8.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Home
          </a>
        </section>
      </div>
    </main>

    <footer>
      <p class="footer-meta">
        <strong>FLHSHelp.com</strong> · IT Support · Fort Lauderdale High School
        <br />
        <a
          class="footer-credit"
          href="https://www.linkedin.com/in/rjrmt/"
          target="_blank"
          rel="noopener noreferrer"
        >Designed by IT Specialist RJ</a>
      </p>
      <a class="footer-mail" href="mailto:rajesh.ramautar@browardschools.com">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.5 7.25A2.25 2.25 0 0 1 6.75 5h10.5A2.25 2.25 0 0 1 19.5 7.25v9.5A2.25 2.25 0 0 1 17.25 19H6.75A2.25 2.25 0 0 1 4.5 16.75v-9.5Z" stroke="currentColor" stroke-width="1.7"/>
          <path d="m5.25 7.5 6.2 4.65c.33.25.77.25 1.1 0l6.2-4.65" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Email the IT Specialist
      </a>
    </footer>
  </div>

  <script>
    (() => {
      const CSV_URL = "../data/homerooms.csv";
      const STUDENT_ID_LEN = 10;
      const AUTO_SEARCH_MS = 120;
      const form = document.getElementById("homeroom-form");
      const input = document.getElementById("student-number");
      const searchBtn = document.getElementById("search-btn");
      const results = document.getElementById("results");
      const statusLine = document.getElementById("status-line");

      /** @type {Map<string, object> | null} */
      let byId = null;
      /** @type {Promise<Map<string, object>> | null} */
      let loadPromise = null;
      let autoSearchTimer = 0;
      let lastAutoSearched = "";
      let searchInFlight = false;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (ch === '"' && next === '"') {
              cell += '"';
              i += 1;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              cell += ch;
            }
            continue;
          }

          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            row.push(cell);
            cell = "";
          } else if (ch === "\n") {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else if (ch === "\r") {
            // skip
          } else {
            cell += ch;
          }
        }

        if (cell.length || row.length) {
          row.push(cell);
          rows.push(row);
        }

        return rows.filter((r) => r.some((c) => String(c).trim() !== ""));
      }

      /** Digits only — keeps leading zeros the user typed. */
      function digitsOnly(value) {
        return String(value || "").replace(/\D/g, "");
      }

      /**
       * Canonical 10-digit student ID string (school format starts with 06).
       * Pads shorter digit strings; never strips leading zeros.
       */
      function normalizeStudentId(raw) {
        const digits = digitsOnly(raw);
        if (!digits) return "";
        if (digits.length < STUDENT_ID_LEN) return digits.padStart(STUDENT_ID_LEN, "0");
        return digits;
      }

      async function loadData() {
        if (byId) return byId;
        if (!loadPromise) {
          loadPromise = (async () => {
            const res = await fetch(CSV_URL, { cache: "no-cache" });
            if (!res.ok) throw new Error(`Could not load homeroom data (${res.status})`);
            const text = await res.text();
            const rows = parseCsv(text);
            if (rows.length < 2) throw new Error("Homeroom data file is empty");

            const header = rows[0].map((h) => h.trim());
            const idx = Object.fromEntries(header.map((h, i) => [h, i]));
            const map = new Map();

            for (let i = 1; i < rows.length; i += 1) {
              const r = rows[i];
              const studentId = normalizeStudentId(r[idx.student_id]);
              if (!studentId) continue;
              const record = {
                studentId,
                name: (r[idx.name] || "").trim(),
                grade: (r[idx.grade] || "").trim(),
                whiteTeacher: (r[idx.white_teacher] || "").trim(),
                whiteRoom: (r[idx.white_room] || "").trim(),
                blueTeacher: (r[idx.blue_teacher] || "").trim(),
                blueRoom: (r[idx.blue_room] || "").trim(),
              };
              if (!map.has(studentId)) map.set(studentId, record);
            }

            byId = map;
            return map;
          })().catch((err) => {
            loadPromise = null;
            throw err;
          });
        }
        return loadPromise;
      }

      function setStatus(message, tone = "") {
        statusLine.textContent = message || "";
        if (tone) statusLine.dataset.tone = tone;
        else delete statusLine.dataset.tone;
      }

      function displayValue(value) {
        return value && String(value).trim() ? String(value).trim() : "—";
      }

      function lastNameLetter(fullName) {
        const raw = String(fullName || "").trim();
        if (!raw) return "";
        const last = raw.includes(",")
          ? raw.split(",")[0].trim()
          : raw.split(/\s+/).slice(-1)[0];
        const letter = last.replace(/[^A-Za-z]/g, "").charAt(0).toUpperCase();
        return letter;
      }

      function gradeLevel(gradeRaw) {
        const digits = String(gradeRaw || "").replace(/\D/g, "");
        if (!digits) return null;
        const n = Number(digits);
        if (n >= 9 && n <= 12) return n;
        return null;
      }

      const COUNSELORS = [
        {
          from: "A",
          to: "E",
          name: "Kathleen Jackson",
          phone: "754-322-1143",
          tel: "7543221143",
          photo: "../assets/images/staff/counselors/jackson.png",
          href: "counselors.html",
        },
        {
          from: "F",
          to: "L",
          name: "Rachel Montrose",
          phone: "754-322-1145",
          tel: "7543221145",
          photo: "../assets/images/staff/counselors/montrose.png",
          href: "counselors.html",
        },
        {
          from: "M",
          to: "R",
          name: "Taraneh Abreu",
          phone: "754-322-1154",
          tel: "7543221154",
          photo: "../assets/images/staff/counselors/abreu.png",
          href: "counselors.html",
        },
        {
          from: "S",
          to: "Z",
          name: "Andrea Amison",
          phone: "754-322-1162",
          tel: "7543221162",
          photo: "../assets/images/staff/counselors/amison.png",
          href: "counselors.html",
        },
      ];

      const ASSISTANT_PRINCIPALS = {
        9: {
          name: "Andre Shannon",
          title: "9th Grade Assistant Principal",
          photo: "../assets/images/staff/administrators/shannon.png",
          href: "administrators.html",
        },
        10: {
          name: "Tracie K. Latimer",
          title: "10th Grade Assistant Principal",
          photo: "../assets/images/staff/administrators/latimer.png",
          href: "administrators.html",
        },
        11: {
          name: "Karleen Thompson",
          title: "11th Grade Assistant Principal",
          photo: "../assets/images/staff/administrators/thompson.png",
          href: "administrators.html",
        },
        12: {
          name: "Edward Rodriguez",
          title: "12th Grade Assistant Principal",
          photo: "../assets/images/staff/administrators/rodriguez.png",
          href: "administrators.html",
        },
      };

      function counselorForName(fullName) {
        const letter = lastNameLetter(fullName);
        if (!letter) return null;
        return (
          COUNSELORS.find((c) => letter >= c.from && letter <= c.to) || null
        );
      }

      function assistantPrincipalForGrade(gradeRaw) {
        const grade = gradeLevel(gradeRaw);
        if (!grade) return null;
        return ASSISTANT_PRINCIPALS[grade] || null;
      }

      function staffCardHtml({ role, name, detailHtml, photo, href, alt }) {
        return `
          <div class="staff-card">
            <div class="staff-photo-wrap">
              <img class="staff-photo" src="${escapeHtml(photo)}" width="160" height="160" alt="${escapeHtml(alt || name)}" loading="lazy" decoding="async" />
            </div>
            <div class="staff-copy">
              <p class="staff-role">${escapeHtml(role)}</p>
              <p class="staff-name">${escapeHtml(name)}</p>
              <p class="staff-detail">${detailHtml}</p>
              <a class="staff-dir-link" href="${escapeHtml(href)}">Open directory →</a>
            </div>
          </div>
        `;
      }

      function supportStaffHtml(record) {
        const counselor = counselorForName(record.name);
        const ap = assistantPrincipalForGrade(record.grade);
        const cards = [];

        if (counselor) {
          cards.push(
            staffCardHtml({
              role: "Your counselor",
              name: counselor.name,
              detailHtml: `Last names ${escapeHtml(counselor.from)}–${escapeHtml(counselor.to)} · <a href="tel:${escapeHtml(counselor.tel)}">${escapeHtml(counselor.phone)}</a>`,
              photo: counselor.photo,
              href: counselor.href,
              alt: counselor.name,
            })
          );
        }

        if (ap) {
          cards.push(
            staffCardHtml({
              role: "Your assistant principal",
              name: ap.name,
              detailHtml: escapeHtml(ap.title),
              photo: ap.photo,
              href: ap.href,
              alt: ap.name,
            })
          );
        }

        if (!cards.length) return "";

        return `
          <div class="result-block result-block--support">
            <div class="result-block-title">Your support team</div>
            <div class="staff-stack">
              ${cards.join("")}
            </div>
          </div>
        `;
      }

      /**
       * School room codes are building-room, e.g. 17-1754 → Building 17, Room 1754.
       * Non-matching values are shown as the raw string (escaped by the caller via HTML).
       */
      function parseRoomCode(raw) {
        const value = String(raw || "").trim();
        if (!value) return null;
        const match = value.match(/^(\d+)\s*-\s*(\d+)$/);
        if (!match) return null;
        return { building: match[1], room: match[2] };
      }

      function formatRoomHtml(raw) {
        const value = String(raw || "").trim();
        if (!value) {
          return `<span class="result-value is-muted">—</span>`;
        }
        const parsed = parseRoomCode(value);
        if (!parsed) {
          return `<span class="result-value">${escapeHtml(value)}</span>`;
        }
        return `
          <span class="result-value room-loc" title="${escapeHtml(value)}">
            <span class="room-loc-line room-loc-building">Building ${escapeHtml(parsed.building)}</span>
            <span class="room-loc-line room-loc-room">Room ${escapeHtml(parsed.room)}</span>
            <a class="room-map-link" href="map.html?b=${encodeURIComponent(parsed.building)}">Show on map</a>
          </span>
        `;
      }

      function showNotFound(query) {
        results.hidden = false;
        results.classList.add("is-visible");
        results.innerHTML = `
          <div class="result-row">
            <span class="result-label">Name</span>
            <span class="result-value is-error">Student Not Found</span>
          </div>
          <div class="result-row">
            <span class="result-label">Grade</span>
            <span class="result-value is-muted">—</span>
          </div>
          <p class="error-banner">
            No record found for student number: ${escapeHtml(query)}.
            Please verify your student number and try again.
          </p>
        `;
      }

      function showRecord(record) {
        results.hidden = false;
        results.classList.add("is-visible");
        results.innerHTML = `
          <div class="result-row">
            <span class="result-label">Name</span>
            <span class="result-value">${escapeHtml(displayValue(record.name))}</span>
          </div>
          <div class="result-row">
            <span class="result-label">Grade</span>
            <span class="result-value">${escapeHtml(displayValue(record.grade))}</span>
          </div>
          <div class="result-row">
            <span class="result-label">Student Number</span>
            <span class="result-value">${escapeHtml(displayValue(record.studentId))}</span>
          </div>
          <div class="result-block result-block--white">
            <div class="result-block-title">White Day Homeroom · Period 1</div>
            <div class="result-row">
              <span class="result-label">Teacher</span>
              <span class="result-value">${escapeHtml(displayValue(record.whiteTeacher))}</span>
            </div>
            <div class="result-row">
              <span class="result-label">Location</span>
              ${formatRoomHtml(record.whiteRoom)}
            </div>
          </div>
          <div class="result-block result-block--blue">
            <div class="result-block-title">Blue Day Homeroom · Period 5</div>
            <div class="result-row">
              <span class="result-label">Teacher</span>
              <span class="result-value">${escapeHtml(displayValue(record.blueTeacher))}</span>
            </div>
            <div class="result-row">
              <span class="result-label">Location</span>
              ${formatRoomHtml(record.blueRoom)}
            </div>
          </div>
          ${supportStaffHtml(record)}
        `;
      }

      function lookup(map, rawQuery) {
        const key = normalizeStudentId(rawQuery);
        return key ? map.get(key) || null : null;
      }

      async function runSearch() {
        const queryDigits = digitsOnly(input.value);
        if (!queryDigits) {
          setStatus("Enter your student number to search.", "error");
          showNotFound("(empty)");
          input.focus();
          return;
        }

        if (searchInFlight) return;
        searchInFlight = true;
        searchBtn.disabled = true;
        setStatus("Searching…");

        try {
          const map = await loadData();
          const record = lookup(map, queryDigits);
          if (record) {
            setStatus("");
            showRecord(record);
          } else {
            setStatus("");
            showNotFound(normalizeStudentId(queryDigits) || queryDigits);
          }
        } catch (err) {
          console.error(err);
          setStatus("Could not load homeroom data. Please try again.", "error");
          results.hidden = true;
          results.classList.remove("is-visible");
          results.innerHTML = "";
        } finally {
          searchInFlight = false;
          searchBtn.disabled = false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        window.clearTimeout(autoSearchTimer);
        runSearch();
      });

      input.addEventListener("input", () => {
        const digits = digitsOnly(input.value);
        if (input.value !== digits) input.value = digits;

        window.clearTimeout(autoSearchTimer);
        if (digits.length < STUDENT_ID_LEN) {
          lastAutoSearched = "";
          return;
        }

        if (digits.length === STUDENT_ID_LEN && digits !== lastAutoSearched) {
          autoSearchTimer = window.setTimeout(() => {
            lastAutoSearched = digits;
            runSearch();
          }, AUTO_SEARCH_MS);
        }
      });

      // Warm the CSV cache so the first search feels instant.
      loadData().catch(() => {});

      // Deep-link from Student Hub: ?id=0618…
      const params = new URLSearchParams(location.search);
      const fromQuery = digitsOnly(params.get("id") || params.get("student") || "");
      if (fromQuery.length === STUDENT_ID_LEN) {
        input.value = fromQuery;
        lastAutoSearched = fromQuery;
        runSearch();
      }
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../sw.js").catch(() => {});
      });
    }
  </script>
