<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="STAR Mission Control — live floor and bathroom pass tracking." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Mission Control | STAR</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/app-store.css" />
</head>
<body>
  <div class="page">
    <main class="center">
      <section class="board" id="lock-gate" aria-labelledby="gate-title">
        <div class="top">
          <div class="brand">
            <img src="../../assets/brand/logo.png" width="88" height="88" alt="" />
            <div>
              <p class="kicker">Staff only</p>
              <h1 id="gate-title">Mission Control</h1>
            </div>
          </div>
          <a class="home" href="index.html">STAR</a>
        </div>
        <p class="lead">Unlock with the staff upload key to see who is in STAR and who is out on a bathroom pass.</p>
        <form id="unlock-form">
          <label class="field">
            <span>Staff upload key</span>
            <input id="upload-key" type="password" autocomplete="current-password" required placeholder="Paste staff upload key" />
          </label>
          <button class="btn btn-primary" type="submit" style="margin-top:0.85rem">Unlock</button>
          <p class="status" id="gate-status" role="status"></p>
        </form>
      </section>

      <div id="app" hidden style="width:min(100%,72rem)">
        <section class="board wide" aria-labelledby="track-title">
          <div class="top">
            <div class="brand">
              <img src="../../assets/brand/logo.png" width="88" height="88" alt="" />
              <div>
                <p class="kicker">Live floor</p>
                <h1 id="track-title">Mission Control</h1>
              </div>
            </div>
            <a class="home" href="index.html">STAR</a>
          </div>
          <div class="stats" id="stats"></div>
          <div class="filter-chips" id="board-chips">
            <button type="button" class="filter-chip is-on" data-board="floor">STAR floor</button>
            <button type="button" class="filter-chip" data-board="bathroom">Bathroom</button>
          </div>
          <div class="filter-chips" id="status-chips">
            <button type="button" class="filter-chip is-on" data-status="all">All</button>
            <button type="button" class="filter-chip" data-status="open">Out / here now</button>
            <button type="button" class="filter-chip" data-status="closed">Returned</button>
          </div>
          <div class="toolbar">
            <label class="field">
              <span>Date</span>
              <input id="date-filter" type="date" />
            </label>
            <label class="field">
              <span>Search</span>
              <input id="row-search" type="search" placeholder="Name or student ID…" />
            </label>
            <button type="button" class="btn btn-secondary" id="export-csv">Download CSV</button>
          </div>
          <p class="status" id="status" role="status"></p>
          <div class="table-wrap" id="floor-table">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Gr</th>
                  <th>Subject / teacher</th>
                  <th>Bus</th>
                  <th>Form</th>
                  <th>Time</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows-body"></tbody>
            </table>
          </div>
          <div class="table-wrap" id="bath-table" hidden>
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Gr</th>
                  <th>Out</th>
                  <th>Back</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="bath-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/app-store-mission.js"></script>
</body>
</html>
