<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="STAR Mission Control — live floor and bathroom pass tracking." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Mission Control | STAR</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/app-store.css?v=127" />
</head>
<body>
  <div class="page">
    <main class="center">
      <section class="board" id="lock-gate" aria-labelledby="gate-title">
        <div class="top">
          <div class="brand">
            <img src="../../assets/brand/logo.png" width="88" height="88" alt="" />
            <div>
              <p class="kicker">Staff only</p>
              <h1 id="gate-title">Mission Control</h1>
            </div>
          </div>
          <a class="home" href="index.html">STAR</a>
        </div>
        <p class="lead">Sign in with your @browardschools.com email to see who is in STAR and who is out on a bathroom pass.</p>
        <form id="unlock-form">
          <label class="field">
            <span>BCPS email</span>
            <input id="staff-email" type="email" autocomplete="username" required placeholder="name@browardschools.com" />
          </label>
          <button class="btn btn-primary" type="button" id="staff-send" style="margin-top:0.85rem">Send code</button>
          <label class="field" id="staff-code-wrap" hidden style="margin-top:0.85rem">
            <span>6-digit code</span>
            <input id="staff-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
          </label>
          <button class="btn btn-primary" type="button" id="staff-verify" hidden style="margin-top:0.85rem">Sign in</button>
          <p class="status" id="gate-status" role="status"></p>
        </form>
      </section>

      <div id="app" hidden style="width:min(100%,72rem)">
        <section class="board wide" aria-labelledby="track-title">
          <div class="top">
            <div class="brand">
              <img src="../../assets/brand/logo.png" width="88" height="88" alt="" />
              <div>
                <p class="kicker">Live floor</p>
                <h1 id="track-title">Mission Control</h1>
              </div>
            </div>
            <a class="home" href="index.html">STAR</a>
          </div>
          <div class="stats" id="stats"></div>
          <div class="filter-chips" id="board-chips">
            <button type="button" class="filter-chip is-on" data-board="floor" aria-pressed="true">STAR floor</button>
            <button type="button" class="filter-chip" data-board="bathroom" aria-pressed="false">Bathroom</button>
          </div>
          <div class="mc-filters" id="floor-filters">
            <div class="mc-filter">
              <span>Here</span>
              <div class="filter-chips" id="here-chips">
                <button type="button" class="filter-chip is-on" data-here="all" aria-pressed="true">All</button>
                <button type="button" class="filter-chip" data-here="open" aria-pressed="false">Here now</button>
                <button type="button" class="filter-chip" data-here="closed" aria-pressed="false">Checked out</button>
              </div>
            </div>
            <div class="mc-filter">
              <span>Bus form</span>
              <div class="filter-chips" id="form-chips">
                <button type="button" class="filter-chip is-on" data-form="all" aria-pressed="true">All</button>
                <button type="button" class="filter-chip" data-form="missing" aria-pressed="false">Missing</button>
                <button type="button" class="filter-chip" data-form="received" aria-pressed="false">On file</button>
              </div>
            </div>
            <div class="mc-filter">
              <span>Bus</span>
              <div class="filter-chips" id="bus-chips">
                <button type="button" class="filter-chip is-on" data-bus="all" aria-pressed="true">All</button>
                <button type="button" class="filter-chip" data-bus="yes" aria-pressed="false">Needs bus</button>
                <button type="button" class="filter-chip" data-bus="no" aria-pressed="false">No bus</button>
              </div>
            </div>
            <label class="field mc-subject">
              <span>Subject</span>
              <select id="subject-filter">
                <option value="">All subjects</option>
              </select>
            </label>
          </div>
          <div class="mc-filters" id="bath-filters" hidden>
            <div class="mc-filter">
              <span>Pass</span>
              <div class="filter-chips" id="bath-chips">
                <button type="button" class="filter-chip is-on" data-bath="all" aria-pressed="true">All</button>
                <button type="button" class="filter-chip" data-bath="open" aria-pressed="false">Out now</button>
                <button type="button" class="filter-chip" data-bath="closed" aria-pressed="false">Returned</button>
              </div>
            </div>
          </div>
          <div class="toolbar">
            <label class="field">
              <span>Date</span>
              <input id="date-filter" type="date" />
            </label>
            <label class="field mc-search">
              <span>Search</span>
              <input id="row-search" type="search" placeholder="Name, ID, subject, or teacher" />
            </label>
            <button type="button" class="btn btn-secondary" id="export-csv">Download CSV</button>
          </div>
          <p class="status" id="status" role="status"></p>
          <div class="table-wrap mc-scroll" id="floor-table">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Grade</th>
                  <th>Subject</th>
                  <th>Bus</th>
                  <th>Form</th>
                  <th>In</th>
                  <th>Out</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows-body"></tbody>
            </table>
          </div>
          <div class="table-wrap mc-scroll" id="bath-table" hidden>
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Grade</th>
                  <th>Out</th>
                  <th>Back</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="bath-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/staff-session.js"></script>
  <script src="../../js/staff-gate.js"></script>
  <script src="../../js/app-store-mission.js?v=126"></script>
</body>
</html>
