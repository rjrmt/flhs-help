<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FLHS take-home laptop eligibility — scan your student number to check Opt-In status." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Laptop Check" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Laptop Eligibility | FLHSHelp</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-200: #9eb8dc;
      --navy: #002366;
      --royal: #0056b3;
      --blue-600: #004a9c;
      --ink-900: #002366;
      --ink-500: #3d5680;
      --ink-400: #5a7194;
      --border: rgba(197, 204, 216, 0.65);
      --border-soft: rgba(0, 35, 102, 0.16);
      --shadow: 0 28px 64px rgba(0, 35, 102, 0.22), 0 10px 24px rgba(0, 35, 102, 0.12);
      --radius-xl: 1.75rem;
      --ok-deep: #0d5a36;
      --deny-deep: #7f0711;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink-900);
      background: var(--sky-200);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
      background:
        radial-gradient(ellipse 95% 70% at 6% -12%, rgba(0, 86, 179, 0.38), transparent 58%),
        radial-gradient(ellipse 80% 60% at 98% 0%, rgba(0, 35, 102, 0.32), transparent 55%),
        radial-gradient(ellipse 70% 50% at 48% 108%, rgba(0, 86, 179, 0.28), transparent 62%),
        linear-gradient(168deg, #b7cce8 0%, #9eb8dc 42%, #7fa3d0 78%, #6d94c4 100%);
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 60%, rgba(197, 204, 216, 0.5) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 64px 64px;
      opacity: 0.4;
      pointer-events: none;
    }
    header, main, footer { position: relative; z-index: 1; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.1rem 0.25rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }
    .brand img {
      width: 3.1rem;
      height: 3.1rem;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 35, 102, 0.28));
    }
    .brand-kicker {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.55;
    }
    .brand-name {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
    }
    .badge {
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border-soft);
      color: var(--navy);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.6rem, 2vw, 1.4rem) 1rem 0.6rem;
    }
    .board-stage {
      position: relative;
      width: min(40rem, 100%);
    }
    .board-floor {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -0.35rem;
      height: 2.5rem;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(0, 35, 102, 0.35), transparent 72%);
      filter: blur(12px);
      transform: scaleY(0.5);
    }
    .board {
      position: relative;
      z-index: 1;
      padding: clamp(1.35rem, 4vw, 2.1rem) clamp(1.1rem, 3.5vw, 1.85rem);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0%, rgba(244, 248, 255, 0.78) 48%, rgba(232, 240, 250, 0.7) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.98),
        0 0 0 1px rgba(197, 204, 216, 0.28),
        var(--shadow);
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(28px) saturate(1.25);
      text-align: center;
    }
    .board-kicker {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--royal);
      margin-bottom: 0.35rem;
    }
    .board h1 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(1.55rem, 5.2vw, 2.35rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--navy);
      text-wrap: balance;
    }
    .lead {
      margin: 0.7rem 0 1.25rem;
      font-size: clamp(1rem, 2.6vw, 1.18rem);
      font-weight: 600;
      line-height: 1.4;
      color: var(--ink-500);
      text-wrap: balance;
    }
    .lead strong {
      display: block;
      color: var(--navy);
      font-weight: 800;
      font-size: 1.08em;
      margin-bottom: 0.2rem;
    }
    .search-form {
      display: flex;
      gap: 0.55rem;
      align-items: stretch;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      height: 3.35rem;
      padding: 0 1rem;
      border-radius: 0.85rem;
      border: 1.5px solid rgba(0, 35, 102, 0.28);
      background: rgba(255, 255, 255, 0.92);
      color: var(--navy);
      font: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      box-shadow: inset 0 1px 0 #fff;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--blue-600);
      box-shadow: inset 0 1px 0 #fff, 0 0 0 3px rgba(47, 111, 237, 0.22);
    }
    .search-btn {
      flex-shrink: 0;
      height: 3.35rem;
      padding: 0 1.2rem;
      border: none;
      border-radius: 0.85rem;
      background: linear-gradient(180deg, #1a4bb8 0%, var(--navy) 100%);
      color: #fff;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 8px 18px rgba(0, 35, 102, 0.22);
    }
    .search-btn:hover { filter: brightness(1.06); }
    .search-btn:disabled { opacity: 0.65; cursor: wait; }
    .hint {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-400);
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.65rem 1.1rem;
      padding: 0.5rem 1.1rem 1.35rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(0, 35, 102, 0.78);
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      height: 2.55rem;
      padding: 0 1.05rem;
      border-radius: 0.85rem;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      background: linear-gradient(180deg, #1a4bb8 0%, var(--navy) 100%);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 8px 18px rgba(0, 35, 102, 0.2);
    }
    .home-btn svg { width: 1.05rem; height: 1.05rem; }
    .sync-note { width: 100%; color: var(--ink-400); font-size: 0.74rem; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1rem;
      cursor: pointer;
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      width: min(52rem, 100%);
      padding: clamp(1.4rem, 5vw, 2.6rem);
      border-radius: 1.6rem;
      text-align: center;
      color: #fff;
      box-shadow: var(--shadow);
    }
    .overlay-kicker {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.82;
      margin-bottom: 0.55rem;
    }
    .overlay-card h2 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(1.55rem, 5.6vw, 2.85rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-wrap: balance;
    }
    .overlay-name {
      margin-top: 0.85rem;
      font-size: clamp(1.2rem, 3.4vw, 1.85rem);
      font-weight: 800;
    }
    .overlay-detail, .overlay-meta { margin-top: 0.35rem; font-weight: 600; }
    .overlay-hint {
      margin-top: 1.15rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .overlay.is-ok { background: rgba(13, 90, 54, 0.82); }
    .overlay.is-ok .overlay-card { background: linear-gradient(160deg, #1aa05d, var(--ok-deep)); }
    .overlay.is-already { background: rgba(120, 53, 15, 0.78); }
    .overlay.is-already .overlay-card { background: linear-gradient(160deg, #d97706, #92400e); }
    .overlay.is-deny { background: rgba(127, 7, 17, 0.86); }
    .overlay.is-deny .overlay-card { background: linear-gradient(160deg, #e11d2e, var(--deny-deep)); }
    .overlay.is-missing { background: rgba(0, 35, 102, 0.72); }
    .overlay.is-missing .overlay-card { background: linear-gradient(160deg, #1d4ed8, var(--navy)); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    @media (max-width: 640px) {
      .search-form { flex-direction: column; }
      .badge { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .search-btn:hover, .home-btn:hover { filter: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <img src="../assets/brand/logo.png" width="80" height="80" alt="Fort Lauderdale High School" />
        <div>
          <p class="brand-kicker">Media Center</p>
          <p class="brand-name">FLHS Help</p>
        </div>
      </div>
      <p class="badge">Student check</p>
    </header>

    <main>
      <div class="board-stage">
        <div class="board-floor" aria-hidden="true"></div>
        <section class="board" aria-labelledby="kiosk-title">
          <p class="board-kicker">Take-home laptop eligibility</p>
          <h1 id="kiosk-title">Check your eligibility</h1>
          <p class="lead">
            <strong>Scan or type your student number.</strong>
            We’ll tell you if your Opt-In form is on file.
          </p>
          <form class="search-form" id="checkout-form" autocomplete="off">
            <label class="sr-only" for="student-number">Student number</label>
            <input
              class="search-input"
              id="student-number"
              name="studentNumber"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="10"
              placeholder="Student Number"
              required
              autofocus
              autocapitalize="off"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="search-btn" type="submit" id="search-btn">Check</button>
          </form>
          <p class="hint">Parent Opt-In form required · Grades 9–12 · Pickup in the Media Center</p>
        </section>
      </div>
    </main>

    <footer>
      <a class="home-btn" href="resources.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.5 11.25 12 4.75l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 10.75V19a.75.75 0 0 0 .75.75h3.5v-4.5h2.5v4.5h3.5A.75.75 0 0 0 18 19v-8.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Student Resources
      </a>
      <p class="sync-note" id="sync-note">Loading…</p>
    </footer>
  </div>

  <div class="overlay" id="result-overlay" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/flhs-db.js"></script>
  <script src="../js/laptop-checkout.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
