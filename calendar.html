<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FLHS 2026–2027 school calendar — white/blue days, early release, closed days, and more." />
  <meta name="theme-color" content="#9eb8dc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FLHS Help" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>School Calendar | FLHSHelp</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-200: #9eb8dc;
      --navy: #002366;
      --royal: #0056b3;
      --ink-900: #002366;
      --ink-700: #1a3a6e;
      --ink-500: #3d5680;
      --ink-400: #5a7194;
      --glass: rgba(255, 255, 255, 0.72);
      --border: rgba(197, 204, 216, 0.65);
      --border-soft: rgba(0, 35, 102, 0.16);
      --shadow: 0 28px 64px rgba(0, 35, 102, 0.22), 0 10px 24px rgba(0, 35, 102, 0.12);
      --shadow-soft: 0 12px 30px rgba(0, 35, 102, 0.14);
      --cal-white-bg: #ffffff;
      --cal-white-border: rgba(0, 0, 0, 0.14);
      --cal-white-ink: #0a0a0a;
      --cal-blue-bg: #003399;
      --cal-blue-ink: #ffffff;
      --cal-planning-bg: #c45a18;
      --cal-planning-ink: #ffffff;
      --cal-closed-bg: #4f7a36;
      --cal-closed-ink: #ffffff;
      --cal-erd-bg: #fff7ed;
      --cal-erd-border: #c2410c;
      --cal-erd-ink: #9a3412;
      --cal-exam-gold: #e6b000;
      --cal-exam-gold-deep: #c99200;
      --radius-xl: 1.75rem;
      --radius-lg: 1.25rem;
      --radius-md: 1rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink-900);
      background: var(--sky-200);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 95% 70% at 6% -12%, rgba(0, 86, 179, 0.38), transparent 58%),
        radial-gradient(ellipse 80% 60% at 98% 0%, rgba(0, 35, 102, 0.32), transparent 55%),
        radial-gradient(ellipse 70% 50% at 48% 108%, rgba(0, 86, 179, 0.28), transparent 62%),
        linear-gradient(168deg, #b7cce8 0%, #9eb8dc 42%, #7fa3d0 78%, #6d94c4 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 60%, rgba(197, 204, 216, 0.5) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 64px 64px;
      opacity: 0.4;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: min(72rem, 100%);
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
    }

    .board {
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.55);
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.78) 0%, rgba(236, 244, 255, 0.62) 100%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(1.25);
      -webkit-backdrop-filter: blur(28px) saturate(1.25);
      padding: 1.35rem 1.15rem 1.5rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }

    .logo {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-kicker {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.65;
    }

    h1 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink-900);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .home-btn,
    .today-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.85);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .today-btn {
      background: var(--navy);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 18px rgba(0, 35, 102, 0.22);
    }

    .home-btn svg,
    .today-btn svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    .home-btn:hover {
      background: #fff;
      border-color: rgba(0, 35, 102, 0.28);
    }

    .today-btn:hover {
      background: var(--royal);
      transform: translateY(-1px);
    }

    .home-btn:focus-visible,
    .today-btn:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.4);
      outline-offset: 3px;
    }

    .lead {
      font-size: 0.92rem;
      color: var(--ink-500);
      margin-bottom: 0.85rem;
      max-width: 40rem;
    }

    .status-line {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-400);
      margin-bottom: 0.9rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.55);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink-700);
    }

    .swatch {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 0.28rem;
      border: 1px solid rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .swatch.white { background: var(--cal-white-bg); }
    .swatch.blue { background: var(--cal-blue-bg); }
    .swatch.closed { background: var(--cal-closed-bg); }
    .swatch.planning { background: var(--cal-planning-bg); }
    .swatch.erd {
      background: var(--cal-erd-bg);
      border-color: var(--cal-erd-border);
    }
    .swatch.exam {
      background: linear-gradient(90deg, var(--cal-exam-gold) 50%, var(--cal-blue-bg) 50%);
    }

    .layout {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 900px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 17.5rem;
        align-items: start;
      }

      .detail-panel {
        position: sticky;
        top: 1rem;
      }
    }

    .months {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr));
      gap: 0.85rem;
    }

    .month-card {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 35, 102, 0.1);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      padding: 0.85rem 0.7rem 0.75rem;
    }

    .month-title {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.55rem;
      padding: 0 0.2rem;
    }

    .month-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.2rem;
      margin-bottom: 0.25rem;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-400);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.22rem;
    }

    .cal-day {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(232, 238, 246, 0.55);
      color: var(--ink-400);
      border-radius: 0.55rem;
      min-height: 2.15rem;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cal-day.is-pad {
      visibility: hidden;
      pointer-events: none;
    }

    .cal-day-num {
      position: relative;
      z-index: 1;
    }

    .cal-day.tone-white {
      background: var(--cal-white-bg);
      border-color: var(--cal-white-border);
      color: var(--cal-white-ink);
    }

    .cal-day.tone-blue {
      background: var(--cal-blue-bg);
      border-color: rgba(0, 30, 100, 0.45);
      color: var(--cal-blue-ink);
    }

    .cal-day.tone-closed {
      background: var(--cal-closed-bg);
      border-color: rgba(40, 80, 30, 0.35);
      color: var(--cal-closed-ink);
    }

    .cal-day.tone-planning,
    .cal-day.tone-psd {
      background: var(--cal-planning-bg);
      border-color: rgba(140, 50, 10, 0.35);
      color: var(--cal-planning-ink);
    }

    .cal-day.tone-erd {
      background: var(--cal-erd-bg);
      border-color: var(--cal-erd-border);
      color: var(--cal-erd-ink);
    }

    .cal-day.is-exam {
      box-shadow: inset 0 0 0 2px rgba(230, 176, 0, 0.95);
    }

    .cal-day.is-exam.tone-white {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold) 0%,
        var(--cal-exam-gold) 48%,
        #ffffff 52%,
        #ffffff 100%
      );
    }

    .cal-day.is-exam.tone-blue {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold-deep) 0%,
        var(--cal-exam-gold-deep) 48%,
        var(--cal-blue-bg) 52%,
        var(--cal-blue-bg) 100%
      );
      color: #fff;
    }

    .cal-day.is-exam.tone-erd {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold) 0%,
        var(--cal-exam-gold) 48%,
        var(--cal-erd-bg) 52%,
        var(--cal-erd-bg) 100%
      );
    }

    .cal-day.is-today {
      outline: 2px solid var(--royal);
      outline-offset: 1px;
    }

    .cal-day.is-selected {
      transform: scale(1.06);
      box-shadow: 0 0 0 2px rgba(0, 35, 102, 0.55);
      z-index: 1;
    }

    .cal-day:hover:not(.is-pad) {
      transform: translateY(-1px);
    }

    .cal-day:focus-visible {
      outline: 3px solid rgba(0, 35, 102, 0.45);
      outline-offset: 2px;
    }

    .detail-panel {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 35, 102, 0.12);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-soft);
      padding: 1rem 1rem 1.1rem;
      min-height: 9rem;
    }

    .detail-panel[data-tone="blue"] {
      background: linear-gradient(165deg, #0a4cc4 0%, var(--cal-blue-bg) 100%);
      color: #fff;
      border-color: rgba(0, 30, 100, 0.45);
    }

    .detail-panel[data-tone="white"] {
      background: #fff;
      color: var(--cal-white-ink);
    }

    .detail-panel[data-tone="closed"] {
      background: linear-gradient(165deg, #5f8f42 0%, var(--cal-closed-bg) 100%);
      color: #fff;
    }

    .detail-panel[data-tone="planning"],
    .detail-panel[data-tone="psd"] {
      background: linear-gradient(165deg, #d96a28 0%, var(--cal-planning-bg) 100%);
      color: #fff;
    }

    .detail-panel[data-tone="erd"] {
      background: var(--cal-erd-bg);
      color: var(--cal-erd-ink);
      border-color: var(--cal-erd-border);
    }

    .detail-panel[data-exam="true"][data-tone="white"] {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold) 0%,
        var(--cal-exam-gold) 42%,
        #ffffff 42%,
        #ffffff 100%
      );
    }

    .detail-panel[data-exam="true"][data-tone="blue"] {
      background: linear-gradient(
        135deg,
        var(--cal-exam-gold-deep) 0%,
        var(--cal-exam-gold-deep) 42%,
        var(--cal-blue-bg) 42%,
        var(--cal-blue-bg) 100%
      );
    }

    .detail-eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.78;
      margin-bottom: 0.35rem;
    }

    .detail-title {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .detail-body {
      font-size: 0.92rem;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      opacity: 0.92;
    }

    .detail-meta {
      display: grid;
      gap: 0.15rem;
      font-size: 0.82rem;
      margin-top: 0.45rem;
      padding-top: 0.45rem;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .detail-panel[data-tone="blue"] .detail-meta,
    .detail-panel[data-tone="closed"] .detail-meta,
    .detail-panel[data-tone="planning"] .detail-meta,
    .detail-panel[data-tone="psd"] .detail-meta {
      border-top-color: rgba(255, 255, 255, 0.25);
    }

    .detail-meta span {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .cal-error {
      grid-column: 1 / -1;
      padding: 1rem;
      color: var(--ink-700);
    }

    .cal-error a {
      color: var(--royal);
      font-weight: 700;
    }

    footer {
      position: relative;
      z-index: 1;
      width: min(72rem, 100%);
      margin: 0 auto;
      padding: 0 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      color: rgba(0, 35, 102, 0.78);
      font-size: 0.78rem;
    }

    footer a {
      color: inherit;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .board {
        padding: 1.1rem 0.8rem 1.25rem;
      }

      .cal-day {
        min-height: 2rem;
        font-size: 0.72rem;
        border-radius: 0.45rem;
      }

      .months {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cal-day,
      .home-btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="board" aria-labelledby="cal-title">
        <div class="topbar">
          <div class="brand-lockup">
            <img
              class="logo"
              src="assets/flhs-logo.png"
              width="88"
              height="88"
              alt="Fort Lauderdale High School"
            />
            <div class="brand-text">
              <p class="brand-kicker">FLHSHelp</p>
              <h1 id="cal-title">School Calendar</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <button type="button" class="today-btn" id="cal-today-btn" aria-label="Jump to today">
              Today
            </button>
            <a class="home-btn" href="index.html">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4.5 11.25 12 4.75l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 10.75V19a.75.75 0 0 0 .75.75h3.5v-4.5h2.5v4.5h3.5A.75.75 0 0 0 18 19v-8.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Home
            </a>
          </div>
        </div>

        <p class="lead">
          2026–2027 FLHS days colored to match the official calendar legend. Tap a date for type, periods, and notes.
        </p>
        <p class="status-line" id="cal-status" role="status">Loading calendar…</p>

        <div class="legend" aria-label="Calendar legend">
          <span class="legend-item"><span class="swatch white" aria-hidden="true"></span>White</span>
          <span class="legend-item"><span class="swatch blue" aria-hidden="true"></span>Blue</span>
          <span class="legend-item"><span class="swatch closed" aria-hidden="true"></span>Closed</span>
          <span class="legend-item"><span class="swatch planning" aria-hidden="true"></span>Planning / PSD</span>
          <span class="legend-item"><span class="swatch erd" aria-hidden="true"></span>Early Release</span>
          <span class="legend-item"><span class="swatch exam" aria-hidden="true"></span>Exam</span>
        </div>

        <div class="layout">
          <div id="cal-months" class="months" aria-live="polite"></div>
          <aside
            id="cal-detail"
            class="detail-panel"
            aria-live="polite"
            hidden
          ></aside>
        </div>
      </section>
    </main>

    <footer>
      <p>
        <strong>FLHSHelp.com</strong> · IT Support · Fort Lauderdale High School
      </p>
      <a href="mailto:rajesh.ramautar@browardschools.com">Email the IT Specialist</a>
    </footer>
  </div>

  <script src="calendar.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
